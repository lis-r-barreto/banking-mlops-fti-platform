# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for available hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy type check
        entry: uv run mypy --strict --config-file=pyproject.toml
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest with coverage threshold
        entry: uv run pytest --cov=src/banking_fti --cov-report=term-missing --cov-fail-under=90 -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
      - id: pytest-full
        name: pytest full suite
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        exclude: ^tests/tier3_ml_apps/
