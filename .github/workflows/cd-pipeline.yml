name: Banking GitFlow Pipeline CD & PR Promotion Chain

on:
  push:
    branches:
      - "develop"
      - "release/v*"
      - "main"

concurrency:
  group: cd-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev-validate:
    name: Dev Validation (develop -> dev)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --extra feature --extra train --extra dev

      - name: Validate protected branch and run checks
        run: |
          uv run python -m banking_fti.governance.cli validate-branch --branch develop --allow-protected
          make check

  open-release-pr:
    name: Auto-Open PR (develop -> release/vX.Y.Z, Manual Merge)
    needs: dev-validate
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Compute SemVer and open or update develop -> release PR (auto-merge disabled)
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const { owner, repo } = context.repo;

            execFileSync(
              "git",
              ["fetch", "origin", "+refs/heads/*:refs/remotes/origin/*", "--tags"],
              { stdio: "inherit" },
            );

            let latestTag = "";
            try {
              const tagsRaw = execFileSync(
                "git",
                ["tag", "--merged", "origin/main", "--list", "v*", "--sort=-v:refname"],
                { encoding: "utf8" },
              );
              latestTag =
                tagsRaw
                  .split(/\r?\n/)
                  .map((line) => line.trim())
                  .find((line) => /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(line)) || "";
            } catch {
              latestTag = "";
            }

            const { data: refs } = await github.rest.git.listMatchingRefs({
              owner,
              repo,
              ref: "heads/release/v",
            });
            const existingReleases = refs.map((item) => item.ref.replace("refs/heads/", ""));

            const mergedRaw = execFileSync(
              "git",
              ["branch", "-r", "--merged", "origin/main", "--list", "origin/release/v*"],
              { encoding: "utf8" },
            );
            const mergedReleases = mergedRaw
              .split(/\r?\n/)
              .map((line) => line.trim().replace(/^origin\//, ""))
              .filter(Boolean);

            const { data: openPrs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:develop`,
            });

            const parseSemver = (branch) =>
              branch
                .replace(/^release\/v/, "")
                .split(".")
                .map((n) => Number.parseInt(n, 10));
            const cmpSemver = (a, b) => {
              const pa = parseSemver(a);
              const pb = parseSemver(b);
              for (let i = 0; i < 3; i += 1) {
                if (pa[i] !== pb[i]) return pa[i] - pb[i];
              }
              return 0;
            };
            const unmergedReleases = existingReleases
              .filter((branch) => !mergedReleases.includes(branch))
              .sort(cmpSemver);
            const activeRelease = unmergedReleases.at(-1);
            const cliArgs = [
              "run",
              "python",
              "-m",
              "banking_fti.governance.cli",
              "plan-promotion",
              "--stage",
              "develop-to-release",
              "--latest-tag",
              latestTag,
              "--commit-range",
              "origin/main..HEAD",
              "--main-commit-range",
              "origin/main",
              "--existing-release-branches-json",
              JSON.stringify(existingReleases),
              "--merged-release-branches-json",
              JSON.stringify(mergedReleases),
              "--open-prs-json",
              JSON.stringify(openPrs),
            ];
            if (activeRelease) {
              cliArgs.push("--release-commit-range", `origin/${activeRelease}..HEAD`);
            }

            const planJson = execFileSync("uv", cliArgs, { encoding: "utf8" });
            const plan = JSON.parse(planJson);

            if (plan.action === "noop") {
              core.info(plan.body || "No release PR action required.");
              return;
            }

            if (plan.create_base_from_ref) {
              const { data: mainRef } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${plan.create_base_from_ref}`,
              });
              try {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${plan.base}`,
                  sha: mainRef.object.sha,
                });
              } catch (err) {
                if (err.status !== 422) {
                  throw err;
                }
              }
            }

            if (plan.action === "create") {
              await github.rest.pulls.create({
                owner,
                repo,
                title: plan.title,
                body: plan.body,
                head: plan.head,
                base: plan.base,
              });
            } else if (plan.action === "update") {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: plan.existing_pr_number,
                title: plan.title,
                body: plan.body,
              });
            }

  hom-validate:
    name: Homologation Validation (release/v* -> hom)
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --extra feature --extra train --extra dev

      - name: Validate release branch and run checks
        run: |
          uv run python -m banking_fti.governance.cli validate-branch --branch "$GITHUB_REF_NAME" --allow-release
          make check

  open-main-pr:
    name: Auto-Open PR (release/vX.Y.Z -> main, Manual Merge)
    needs: hom-validate
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Idempotently open or update release -> main PR (auto-merge disabled)
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const { owner, repo } = context.repo;
            const releaseBranch = context.ref.replace("refs/heads/", "");

            const { data: openPrs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${releaseBranch}`,
              base: "main",
            });

            const planJson = execFileSync(
              "uv",
              [
                "run",
                "python",
                "-m",
                "banking_fti.governance.cli",
                "plan-promotion",
                "--stage",
                "release-to-main",
                "--release-branch",
                releaseBranch,
                "--open-prs-json",
                JSON.stringify(openPrs),
              ],
              { encoding: "utf8" },
            );
            const plan = JSON.parse(planJson);

            if (plan.action === "create") {
              await github.rest.pulls.create({
                owner,
                repo,
                title: plan.title,
                body: plan.body,
                head: plan.head,
                base: plan.base,
              });
            } else if (plan.action === "update") {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: plan.existing_pr_number,
                title: plan.title,
                body: plan.body,
              });
            } else {
              core.info(`No PR update needed for ${releaseBranch} -> main.`);
            }

  tag-release:
    name: Tag Release on Main (vX.Y.Z)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Resolve and create SemVer release tag on main
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const { owner, repo } = context.repo;
            const releaseTag = execFileSync(
              "uv",
              [
                "run",
                "python",
                "-m",
                "banking_fti.governance.cli",
                "resolve-release-tag",
                "--commit-ref",
                "HEAD",
              ],
              { encoding: "utf8" },
            ).trim();
            if (!releaseTag) {
              core.info("No release version detected on main HEAD commit; skipping tag creation.");
              return;
            }
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${releaseTag}`,
                sha: context.sha,
              });
              core.info(`Created release tag ${releaseTag} at ${context.sha}.`);
            } catch (err) {
              if (err.status === 422) {
                core.info(`Release tag ${releaseTag} already exists.`);
                return;
              }
              throw err;
            }
