x-feast-env: &feast-env
  FEAST_REPO_PATH: /app/feature_repo
  FEAST_DATA_DIR: /app/feature_repo/data
  RAW_DATA_DIR: /app/data/raw

services:
  feast:
    build:
      context: .
      dockerfile: docker/Dockerfile.feast
    environment: *feast-env
    volumes:
      - feast_data:/app/feature_repo/data

  feature:
    build:
      context: .
      dockerfile: docker/Dockerfile.feature
    depends_on:
      feast:
        condition: service_completed_successfully
    environment: *feast-env
    volumes:
      - ./data/raw:/app/data/raw:ro
      - feast_data:/app/feature_repo/data

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    environment:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  train:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    depends_on:
      feature:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment:
      <<: *feast-env
      MODEL_ARTIFACT_DIR: /app/artifacts/models
      TRAINING_EXECUTOR: local_docker
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: banking_fti
      MLFLOW_ENVIRONMENT: local
      MLFLOW_DISABLE_AGENT_HINT: "1"
      GIT_SHA: ${GIT_SHA:-unknown}
      DVC_LOCK_HASH: ${DVC_LOCK_HASH:-untracked}
    volumes:
      - feast_data:/app/feature_repo/data
      - model_artifacts:/app/artifacts/models

  feast-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.feast-ui
    depends_on:
      feast:
        condition: service_completed_successfully
    environment: *feast-env
    ports:
      - "8889:8888"
    volumes:
      - feast_data:/app/feature_repo/data

  notebook:
    build:
      context: .
      dockerfile: docker/Dockerfile.notebook
    depends_on:
      feature:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      train:
        condition: service_completed_successfully
    environment:
      <<: *feast-env
      MODEL_ARTIFACT_DIR: /app/artifacts/models
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: banking_fti
      MLFLOW_ENVIRONMENT: local
      MLFLOW_DISABLE_AGENT_HINT: "1"
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./feature_repo:/app/feature_repo
      - ./src:/app/src
      - ./data/raw:/app/data/raw:ro
      - feast_data:/app/feature_repo/data
      - model_artifacts:/app/artifacts/models

volumes:
  feast_data: {}
  model_artifacts: {}
  mlflow_data: {}
